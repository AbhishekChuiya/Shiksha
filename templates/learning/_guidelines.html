{% load i18n shiksha %}
<div class="gl-grid">
{% for g in groups %}
  <section class="gl-card {{ g.css }}">
    <h3>{% icon g.icon %}{% trans g.label %}</h3>
    {% if g.chips %}<div class="gl-chips">{% for i in g.items %}<span>{{ i.display_text }}</span>{% endfor %}</div>
    {% else %}<ul>{% for i in g.items %}<li>{{ i.display_text }}</li>{% endfor %}</ul>{% endif %}
  </section>
{% endfor %}
</div>
