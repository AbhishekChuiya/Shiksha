# /etc/nginx/sites-available/shiksha  (then symlink into sites-enabled)
server {
    listen 80;
    server_name shiksha.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shiksha.example.com;

    ssl_certificate     /etc/ssl/shiksha/fullchain.pem;   # from IT / certbot
    ssl_certificate_key /etc/ssl/shiksha/privkey.pem;

    client_max_body_size 500M;   # SOP PDFs and training videos

    location /static/ { alias /srv/shiksha/app/staticfiles/; expires 30d; }
    location /media/  { alias /srv/shiksha/media/; }

    location / {
        proxy_pass http://unix:/run/shiksha/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
